services:
  mysql:
    image: mysql:8.4
    container_name: navigation_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nav
      MYSQL_USER: nszm
      MYSQL_PASSWORD: nszm123..
      TZ: Asia/Shanghai
    ports:
      - "8999:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./dev/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 3s
      retries: 20

  adminer:
    image: adminer:4
    container_name: navigation_adminer
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
